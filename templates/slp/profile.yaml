# The SLP profile (spec/KERNEL.md §2, spec/ROLES.md). Properties are all the kernel reads; prompts, skills and
# models are for the agent host. `models` names the Human's Paseo agent profiles, the first the default; whoever
# opens a scope may pick another from the list.

roles:
  supervisor:
    root: true
    delegates: true
    spawns: [lead, peer, watcher]
    humanDoor: true
    speaksTo: [human, children, descendants]
    prompt: roles/supervisor.md
    skills: [grilling, attention, pre-mortem, retrospective, architecture-premise-audit, appetite, lane-portfolio]
    models: [slp-supervisor]
    tools: [status, record, diff, look, open_scope, amend_brief, set_plan, amend_plan, add_edge, remove_edge,
            handover, classify_finding, integrate, send_back, reseat, drop_scope, hold_scope, resume_scope, release,
            send_message, answer, ask_human, answer_permission, mark_noise, acknowledge, set_checks, run_checks,
            publish]

  lead:
    delegates: true
    spawns: [peer, reviewer]
    speaksTo: [parent, children]
    prompt: roles/lead.md
    skills: [steering, blind-design, planning-lanes, domain-docs, acceptance-walk, repo-refresh]
    models: [slp-lead]
    tools: [status, record, diff, look, open_scope, amend_brief, set_plan, amend_plan, add_edge, remove_edge,
            handover, raise_finding, withdraw_finding, reopen_finding, classify_finding, integrate, send_back, reseat, drop_scope, hand_back,
            hold_scope, resume_scope, release, report, send_message, answer, answer_permission, hold_machine,
            mark_noise, acknowledge, run_checks]

  peer:
    writes: true
    speaksTo: [parent]
    prompt: roles/peer.md
    skills: [test-first, diagnosing-bugs, domain-docs, security-check, proof-audit, spike, measuring, tidy-first]
    models: [slp-peer, slp-peer-alt]
    tools: [status, record, diff, raise_finding, withdraw_finding, reopen_finding, hand_back, run_checks, send_message,
            answer, hold_machine]

  reviewer:
    reading: true
    speaksTo: [parent]
    prompt: roles/reviewer.md
    skills: [security-check, proof-audit]
    models: [slp-reviewer, slp-peer]
    tools: [status, record, diff, record_verdict, raise_finding, withdraw_finding, reopen_finding, send_message, answer,
            hold_machine]

  watcher:
    watches: true
    speaksTo: [parent]
    prompt: roles/watcher.md
    models: [slp-watcher]
    tools: [look, record, diff, attend, pass]

# The sections a report has, each a list of lines and none required. An agent given `report` is shown each with these
# words; whoever reads the report reads its lines under the section's name.
report:
  decided: Each decision a reader could question, as "X because Y".
  assumed: Each assumption nobody checked, as "X, unchecked".
  open: Each disagreement still open.

reflex: reflex.yaml
watch: watch.yaml
# Kept in an attached project's instruction file, committed on its base, so every agent there knows the team is there.
# `docs` are what the team keeps by hand, in the commits of the agents that write: the words of the domain and the
# decisions. `map` is where what the record holds is left when the project is removed.
project:
  file: AGENTS.md
  note: project.md
  map: docs/seatworks/MAP.md
  docs: [GLOSSARY.md, docs/adr]
